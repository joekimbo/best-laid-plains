#How much stress a moving contraption puts on the block that moves it.
#  load   = suPerBlock x blocks + suPerWorkingActor x workingActors
#  stress = load x RPM
#A 20-block contraption at 16 RPM costs 320 SU.
#Actors whose block is in the tag #create_realistic_stress:passive_actors (seats, bells,
#controls, tanks...) count as plain blocks, not working actors.
[load]
	#SU per RPM for every block in the contraption
	# Default: 1.0
	# Range: 0.0 ~ 1000.0
	suPerBlock = 1.0
	#Extra SU per RPM for every working actor (drills, saws, harvesters, ploughs, deployers...)
	# Default: 8.0
	# Range: 0.0 ~ 1000.0
	suPerWorkingActor = 8.0
	#Mechanical bearings, clockwork bearings and gantry shafts take on stress in proportion to the
	#contraption they move. Turn this off to leave all three as Create has them
	bearingsAndGantries = true

#Minecart contraptions are wind-up toys. A rotating Cart Assembler holds a passing (or stopped)
#contraption cart, winds it up, and lets it go when full. Charge is measured in blocks of range.
[wind_up_carts]
	#Master switch for everything in this section
	enabled = true
	#If true, a contraption cart with no charge coasts to a stop and powered rails can't speed it up.
	#If false, uncharged carts roll like vanilla carts and charge only adds self-propulsion.
	requireCharge = true
	#Blocks of travel a full charge gives (unfueled)
	# Default: 256.0
	# Range: 1.0 ~ 100000.0
	maxRange = 256.0
