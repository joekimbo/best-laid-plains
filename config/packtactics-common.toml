[parties]
	#Most parties hunting at once. -1 uses the number of online players; 0 disables new hunts.
	# Default: -1
	# Range: -1 ~ 1000
	party_cap = -1

[ai]
	#Replace the combat AI of ordinary (non-party) hostile mobs. Suspended automatically while Big Brain or Hostile Tactics is installed. Party mobs always use the tactical AI.
	smart_hostiles = true

[advanced]
	#Log why a witch did not throw. Throws are always logged at INFO as witch support: <potion> -> <ally>.
	witch_debug_log = false
	#Write hunt events to packtactics/telemetry/<date>.jsonl in the server directory.
	telemetry = false
