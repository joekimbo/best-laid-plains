[parties]
	#Most parties hunting at once. -1 uses the number of online players; 0 disables new hunts.
	# Default: -1
	# Range: -1 ~ 1000
	party_cap = -1

[ai]
	#Replace the combat AI of ordinary (non-party) hostile mobs. Suspended automatically while Big Brain or Hostile Tactics is installed. Party mobs always use the tactical AI.
	smart_hostiles = true

[advanced]
	#Log why a witch did not throw. Throws are always logged at INFO as witch support: <potion> -> <ally>.
	witch_debug_log = false
	#Write hunt events (rolls, hunts, deaths, kills, call-offs) to packtactics/telemetry/<UTC date>.jsonl in the server directory. Finished days are gzipped.
	telemetry = true
	#Telemetry files older than this many days are deleted.
	# Default: 365
	# Range: 1 ~ 36500
	telemetry_retention_days = 365
	#When the telemetry folder is larger than this, the oldest days are deleted first (today's file never is).
	# Default: 100
	# Range: 1 ~ 1000000
	telemetry_max_total_mb = 100
