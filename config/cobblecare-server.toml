#Starting fullness, walking and move costs. Fullness uses a 0-100 scale.
[fullness]
	#Fullness per 100 blocks walked, sprinted or sneaked. Default: 0.5 per 30 seconds of walking. Zero disables walking costs.
	# Default: 0.38607057370087255
	# Range: 0.0 ~ 100.0
	walkingPer100Blocks = 0.38607057370087255
	#Only released or shoulder-mounted party Pokemon pay walking and upkeep costs.
	releasedOnly = false
	#Apply move costs and hunger penalties in battles with players on both sides.
	inPvP = false

#Food nutrition, diet bonuses and feeding rewards. Diets themselves are item tags in datapacks.
[feeding]

	#Released party Pokemon feed themselves from food in their own diet near their trainer.
	[feeding.foraging]
		#Released party Pokemon eat food they find near their trainer. Pastured Pokemon never do.
		enabled = true

#Move disobedience at zero fullness. Switching and bag items stay available.
[disobedience]
	#Chance per chosen move at zero fullness to disobey. Zero disables.
	# Default: 0.25
	# Range: 0.0 ~ 1.0
	chance = 0.25

#Friendship XP scaling, battle affection and trades.
[friendship]
	#Apply Friendship effects (XP curve, affection, battle wins and forfeits) in PvP battles.
	inPvP = false

	#Earned XP multipliers interpolated between Friendship 0, 128 and 255.
	[friendship.experience]
		#Scale earned XP with Friendship. The well-fed bonus is separate.
		enabled = true

#Online party HP, PP and faint recovery. Nothing banks while offline or in storage.
[recovery]
	#Use Cobblecare's recovery. Disabling restores Cobblemon's native HP and faint recovery.
	enabled = true

#The first released party Pokemon (shoulder mounts included) is your traveling companion.
[companion]
	#Master switch for every traveling-companion effect.
	fieldEffectsEnabled = true

	#Each effect has its own switch and Friendship requirement. Strength = Friendship / 255, scaled for dual types.
	[companion.types]

		#Ghost
		[companion.types.ghost]

			#Sneak into a wall to phase through solid blocks.
			[companion.types.ghost.phasing]
				#Enable this effect. The companion master switch must also be on.
				enabled = true

#EV mochi become battle-long training buffs instead of instant EVs. Fresh-Start Mochi is unchanged.
[mochi]
	#Replace native EV mochi with battle buffs. Disable to restore Cobblemon's instant +4 EVs.
	enabled = true
