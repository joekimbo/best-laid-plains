#EV mochi become battle-long training buffs instead of instant EVs. Fresh-Start Mochi is unchanged.
[mochi]
	#Replace native EV mochi with battle buffs. Disable to restore Cobblemon's instant +4 EVs.
	enabled = true
	#Fullness per mochi at metabolic factor 1, divided by the Pokemon's metabolism like all food (direct points, not food value). Counts as regular diet.
	# Default: 4.0
	# Range: 0.0 ~ 100.0
	fullness = 4.0
	#Battle EVs of the mochi's stat are multiplied by this. Other EVs convert to that stat unmultiplied.
	# Default: 3
	# Range: 1 ~ 10
	matchingEvMultiplier = 3
	#Battles each mochi lasts. More of the same mochi extend it; a different mochi replaces it.
	# Default: 1
	# Range: 1 ~ 100
	battlesPerMochi = 1

