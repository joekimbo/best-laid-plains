[gc]
	#Warn (log, and a toast on the title screen) when the game is not running generational ZGC.
	#Best Laid Plains needs -XX:+UseZGC -XX:+ZGenerational in the JVM arguments to avoid long GC stutters.
	warnIfNotGenerationalZgc = true

[freeterraforged]
	#FreeTerraForged: threads that generate terrain tiles. FreeTerraForged's own value is one per logical CPU (0 = keep it).
	#Fewer threads leave cores free so the JVM can pause quickly for GC; too many cause whole-game freezes
	#while new terrain generates. Measured 2026-10-04: 8 removed freezes over 100 ms for 4% slower generation. Needs a restart.
	#A hardware choice: lower it on a host with little memory or few cores (Winternode's container uses 4).
	# Default: 8
	# Range: 0 ~ 64
	worldgenThreads = 8

[structures]
	#Structures that never generate. Ids ("minecraft:shipwreck") or structure tags ("#minecraft:village").
	#Applies to newly generated chunks only.
	disabled = ["minecraft:pillager_outpost", "minecraft:ruined_portal", "minecraft:ruined_portal_desert", "minecraft:ruined_portal_jungle", "minecraft:ruined_portal_mountain", "minecraft:ruined_portal_ocean", "minecraft:ruined_portal_swamp", "minecraft:shipwreck", "minecraft:shipwreck_beached", "structory:boat"]

	[structures.biomeCheck]
		#Reject a structure if any of its main pieces would sit in a blacklisted biome that isn't one of the structure's own biomes.
		#Keeps villages and similar structures from straddling rivers and coasts. Replaces Structurify's global biome check.
		enabled = true
		#Structures (ids or "#tags") the biome check never rejects.
		exemptStructures = []

	[structures.spacing]
		#Variety radius: in a structure set with several structures (villages, fishing boats, ocean ruins ...), a spot does not use the same structure as a
		#higher-priority spot of the same set within this many chunks; it uses another structure of the set instead, and keeps the original if every one would
		#repeat. Nothing is ever removed, and the result does not depend on generation order. 0 = off.
		# Default: 16
		# Range: 0 ~ 256
		chunks = 16

[effortlessBuilding]
	#Effortless Building: with its 'survival: only break placed blocks' rule on, also allow breaking blocks
	#inside structure pieces (houses, corridors, rooms), so players can clear structures they find.
	allowBreakingInStructures = true
	#Structures (ids or "#tags") whose pieces don't count, e.g. "#minecraft:mineshaft" if mineshafts feel too generous.
	excludedStructures = []

[journeymap]
	#JourneyMap (client only): mobs whose entity type id contains any of these strings show a Poke Ball icon on the
	#minimap, fullscreen map and web map (in the icon display modes) instead of JourneyMap's own icon, or the dot it
	#falls back to when it has none. Default: every Cobblemon entity
	#("cobblemon" also matches addon ids such as "cobblemon_battle_tower:..."). Use "cobblemon:pokemon" for Pokemon only.
	#Empty list = off. Icons another mod sets through JourneyMap's API are left alone.
	pokeBallIconEntities = ["cobblemon"]

[cobblemon]
	#Cobblemon (client only): keep ambient sounds (rivers, shore waves, wind) playing during battles.
	#Cobblemon's battle music otherwise pauses and blocks the ambient category along with music and records.
	keepAmbientInBattles = true
	#Cobblemon: wild Pokemon take fall damage after the spawn protection above runs out. Off by default: Pokemon that
	#spawn in tree canopies (several species do, on purpose) wander off the edge minutes later, and the hurt sound
	#of a fall nobody saw is unsettling. Owned Pokemon still take fall damage.
	wildPokemonFallDamage = false
	#Client only, with Cobblemon: move the chat this many GUI pixels to the right so it isn't drawn behind the party
	#overlay's sixth slot. 0 = off. Raise it if the party overlay is scaled up in Cobblemon's client config.
	# Default: 66
	# Range: 0 ~ 400
	chatOffsetForPartyOverlay = 66

	[cobblemon.wildCries]
		#Cobblemon (client only): now and then a wild Pokemon within earshot but out of its ambient-sound range plays its
		#species' cry, quietly, as ambience. Never during a battle or while a screen is open.
		enabled = true

[sable]
	#Sable (Create: Simulated / Aeronautics physics contraptions): dimensions where new physics contraptions can be
	#assembled. Elsewhere the physics assembler and swivel bearing refuse with an error. Contraptions that already exist
	#keep working. Empty list = everywhere.
	allowedDimensions = ["minecraft:overworld", "minecraft:the_nether", "minecraft:the_end"]

[seasons]
	#Ecliptic Seasons' Serene Seasons API bridge: report wet/dry (tropical) seasons to mods using the Serene Seasons API
	#(SeasonHUD, Thirst Was Taken, Burnt, Dynamic Trees) in seasons.tropicalBiomes, following Ecliptic's monsoon calendar
	#(dry from Beginning of Winter to Grain Rain, wet from Beginning of Summer to First Frost). Off = the bridge's own
	#behaviour (no biome is tropical).
	tropicalSeasons = true
	#Client only, Ecliptic Seasons: how the game names the 24 solar terms. "adapted" (default): Start of Spring, Early Spring,
	#Mid-Spring, Spring Equinox, Late Spring, End of Spring, and the same pattern for the other seasons, in all of Ecliptic's UI and
	#in our Jade line. "traditional": Ecliptic's own names (Beginning of Spring, Rain Water, ...). Applies after the resource packs
	#reload (F3+T) or a restart.
	termNames = "adapted"

[surfaceMonsters]
	#Monsters never spawn naturally at the surface (including the dark ground under tree canopies) in
	#surfaceMonsters.dimensions. Surface = at or above the highest non-leaf block of the column. Caves and anything
	#under rock still spawn monsters; open pits and ravines count as surface. Spawners, structures, raids and patrols
	#are not affected.
	enabled = true

[patrols]
	#Illager Invasion: chance that each pillager in a pillager patrol is replaced by a mob from patrols.replacements. 0 = off.
	#Illager Invasion itself already turns half of all patrol members (leaders too) into marauders; this applies to the rest.
	# Default: 0.3
	# Range: 0.0 ~ 1.0
	replacementChance = 0.3

[wanderingTrader]
	#Create Numismatics: wandering traders sell coins for emeralds as their first trade (10 uses) and every trade
	#priced in emeralds alone also gets a twin priced in coins at the trader's own rate. Added the first time a player
	#interacts with a trader.
	coinTrades = true

[sound]
	#Client only: in single player, the sounds of the categories below keep playing while the game is paused
	#(pause screen, or the window losing focus), instead of everything going silent. Looping sounds continue; the paused
	#world makes no new ones.
	keepPlayingWhilePaused = true

[viaRomana]
	#Via Romana: travelling between signs costs hunger and thirst, growing with the logarithm of the distance up to a cap.
	#Creative and spectator players pay nothing. Thirst needs Thirst Was Taken. Neither goes below empty.
	travelCosts = true

[monsterCap]
	#Soft cap on natural monster spawns per chunk per monsterCap.windowMinutes: once a chunk has had this many, further
	#natural monster spawns there fail until the window ends. Stops a big dark cave refilling as fast as you clear it.
	#Spawners, structures, raids, patrols and party spawns are not counted. 0 = no cap. Counts reset on server restart.
	# Default: 8
	# Range: 0 ~ 1000
	perChunk = 8

[mca]
	#Minecraft Comes Alive: players can't hurt MCA villagers (melee, arrows, TNT, tamed animals, Pokemon and their
	#projectiles). Damage from mobs is unchanged, so partners still defend villagers; zombie villagers stay hittable.
	protectVillagersFromPlayers = true

[toasts]
	#Client only, toasts: mod ids whose toasts are blocked, e.g. ["buggered", "mca", "cobblemon_conveniences"]. A toast belongs to
	#the mod whose jar holds its class, or, for toasts shown the vanilla way (SystemToast), to the mod named by the first part of its
	#translation key (toast.buggered.saved is Buggered's). Every toast seen is listed in config/plainolpatches/toasts-seen.txt.
	blockedMods = ["buggered"]
	#Client only, toasts: block every toast. Blocked toasts are dropped before they are queued.
	blockAll = false
	#Client only, toasts: block advancement toasts.
	blockAdvancements = true
	#Client only, toasts: block recipe unlock toasts.
	blockRecipes = true
	#Client only, toasts: block tutorial toasts.
	blockTutorial = true
	#Client only, toasts: categories to block (a finer choice than toasts.blockedMods; the categories seen so far are listed in
	#config/plainolpatches/toasts-seen.txt). A toast's category is the first translation key in its text (title), without a leading
	#"toast.": toast.buggered.saved is buggered.saved, cobblemon_conveniences.sighting.title is that whole key. An entry blocks
	#the category and everything below it: "buggered" blocks all Buggered toasts, "cobblemon_conveniences.sighting" only the
	#Lodge sightings, "plainolpatches.gc_warning" the GC warning.
	#MCA's own toasts are mca.mail, mca.destiny_not_set and mca.player_not_customized ("mca" blocks all three; MCA Quests
	#toasts are the mod mcaquests). Mods can adopt toast.<modid>.<name> keys to be listed here.
	blockedCategories = []
	#Client only, toasts: how many toasts fit on screen at once (vanilla 5).
	# Default: 3
	# Range: 1 ~ 7
	visibleCount = 3
	#Client only, toasts: move toasts sideways by this many pixels.
	# Default: 0
	# Range: -8192 ~ 8192
	xOffset = 0
	#Client only, toasts: move toasts down by this many pixels.
	# Default: 0
	# Range: -8192 ~ 8192
	yOffset = 0
	#Client only, toasts: show toasts on the left of the screen.
	startLeft = false
	#Client only, toasts: toasts come in from the top of the screen instead of the side.
	topDown = false

		[advanced.freeterraforged.mountains]
			#FreeTerraForged mountain chains: octaves of the ridge noise that draws the crests. FreeTerraForged's own value is 4.
			#Fewer octaves = smoother, simpler crests. Applies to worlds generated after the change.
			# Default: 4
			# Range: 1 ~ 8
			ridgeOctaves = 4
			#FreeTerraForged mountain chains: how much smaller each ridge octave is (frequency multiplier). Its own value is 2.35.
			#Closer to 1 = the octaves stay large (broad, vast crests); higher = busy fine detail.
			# Default: 2.35
			# Range: 1.2 ~ 4.0
			ridgeLacunarity = 2.35
			#FreeTerraForged mountain chains: how strongly the small ridge octaves count against the large one. Its own value is 1.15.
			#Lower = smoother, rounder mountains.
			# Default: 1.15
			# Range: 0.4 ~ 2.5
			ridgeGain = 1.15
			#FreeTerraForged mountain chains: where the valley floors between the crests sit, as a fraction of crest height (0 = valleys
			#reach the base ground, 1 = no valleys). FreeTerraForged's own value is about 0.25. Lower it for deeper, broader valleys.
			# Default: 0.25
			# Range: 0.0 ~ 0.9
			valleyFloor = 0.25
			#FreeTerraForged mountain chains: a soft floor under every valley, as a fraction of crest height, applied after valleyFloor (0 = off, FreeTerraForged's
			#own behaviour). Lowering valleyFloor can clip valleys to the base ground, which is sea level (flat Y63 pockets); this keeps them above it:
			#each 0.01 is about 5.6 blocks at the pack's vertical scale (0.04 is roughly Y85). Needed for high-altitude lakes.
			# Default: 0.0
			# Range: 0.0 ~ 0.5
			valleyMin = 0.0
			#FreeTerraForged 'fancy mountains' (general.fancyMountains): size in blocks of the grid its drainage ridges are built on,
			#before the preset's global horizontal scale. Its own value is 128 (about 380 blocks at the pack's scale). Larger = fewer, wider spurs.
			# Default: 128.0
			# Range: 16.0 ~ 1024.0
			fancyGridSize = 128.0
			#FreeTerraForged 'fancy mountains': how much of the height comes from the drainage ridge pattern instead of the plain ridge
			#noise. Its own value is 0.65.
			# Default: 0.65
			# Range: 0.0 ~ 1.0
			fancyStrength = 0.65
			#FreeTerraForged general.mountainVariety: width of the blend between a region's own mountain field and the neutral one at
			#the region borders, as a multiple of FreeTerraForged's own (1 = unchanged). Larger hides the patchwork seams between regions.
			# Default: 1.0
			# Range: 1.0 ~ 4.0
			varietyBlendWidth = 1.0

			[advanced.freeterraforged.mountains.bowls]
				#Alpine bowls (high-altitude lakes): chance that a grid cell of the mountain chains has a bowl: a dish in a valley with a lip round it and a notch
				#on the downhill side, so Streams Reflowing fills it with a lake at the notch level and connects inlets and an outlet. 0 = off (default).
				# Default: 0.0
				# Range: 0.0 ~ 1.0
				chance = 0.0
				#Alpine bowls: grid cell size, in noise units (before the preset's global horizontal scale: about 3 blocks each at the pack's scale).
				# Default: 700.0
				# Range: 150.0 ~ 3000.0
				cellSize = 700.0
				#Alpine bowls: dish radius, in noise units (40 is about 120 blocks across at the pack's scale, well above Streams Reflowing's lakeMinArea).
				# Default: 40.0
				# Range: 10.0 ~ 300.0
				radius = 40.0
				#Alpine bowls: dish depth as a fraction of crest height (0.04 is about 22 blocks at the pack's vertical scale).
				# Default: 0.04
				# Range: 0.005 ~ 0.3
				depth = 0.04

	[advanced.toasts]
		#Client only, toasts: fully qualified toast class names to block (exact class). Turn on toasts.printClasses to find them.
		blockedClasses = []
		#Client only, toasts: log each toast as it is added (class, kind, mod, translation key, verdict) to help find what to block.
		printClasses = false
