[worldgen]
	#When the world's generator enables vanilla large ore veins (FreeTerraForged preset 'largeOreVeins'),
	#suppress them and instead make every deposit 25% larger by volume at the same ore density.
	#Changing this in an existing world changes new chunks (the world fingerprint will warn).
	replaceLargeOreVeins = true
	#Multiplies every deposit's terrain and climate preferences (terrain_affinity): how much more
	#often iron forms in high country, diamond under wet ground, redstone under dry ground, and so on.
	#0 = deposits ignore terrain and climate (depth, geology and realm still apply); 1 = as the definitions say;
	#2 = twice as strong in log terms. Values much above 1.5 run into each definition's occurrence cap.
	#Deposit counts shift somewhat with this setting. Changing it in an existing world changes new chunks
	#(the world fingerprint will warn).
	# Default: 1.0
	# Range: 0.0 ~ 3.0
	terrainPreferenceStrength = 1.0

[maps]
	#When a surface sample is picked up or otherwise leaves the world, remove its mark from every
	#Prospecting Map that marked it. Off: marks stay until the player unmarks them or rubs the map clean.
	forgetClearedSamples = false

[advanced]
	#Developer/diagnostic: master switch for Prospecting's block placement (ore bodies). Off = plain
	#terrain, for measuring Prospecting's cost against the same world without it.
	worldgenEnabled = true
