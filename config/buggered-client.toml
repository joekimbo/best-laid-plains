[reporter]
	#Name or handle shown on your reports. Blank uses your player name.
	#It is used only for the account it was saved for (advanced.reporter.account); on any other account the player name is used.
	handle = ""

[ui]
	#Keep your attachment choices between reports. Off by default: every attachment starts unticked on every report.
	#A crash or freeze report still pre-ticks its own crash files.
	remember_attachment_choices = false

[privacy]
	#Send log, crash and profile attachments WITHOUT redaction (only home paths are shortened).
	#By default they are redacted: chat, your user and player names, UUIDs, tokens, server addresses and e-mail addresses are removed.
	#Turn this on only if redaction hides something you need; the form then warns that the contents are sent as they are. Off by default.
	allow_unredacted_attachments = false

[telemetry]
	#Record a few seconds of structured play history (position, screens, targets, frame times) in memory,
	#so a report can include what happened just before. Off by default. Never records chat or packets.
	enabled = true
	#How many seconds of history a report can include (10, 30 or 60). The report form's button changes it.
	# Default: 30
	# Range: 10 ~ 60
	window_seconds = 30

[jfr]
	#Keep a rolling Java Flight Recorder profile of the last minutes (about 1% CPU) so a performance
	#report can include it. Off by default; the profile is redacted by construction and checked before it is attached.
	enabled = true

	[advanced.reporter]
		#Set by Buggered: the account (profile id) that reporter.handle belongs to. Leave it alone.
		account = ""
